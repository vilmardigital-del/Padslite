<!doctype html>
<html lang="pt-BR" class="dark notranslate" translate="no" style="background: linear-gradient(135deg, #04091a 0%, #071330 25%, #0b1f4d 50%, #081636 75%, #030712 100%); color: #ffffff;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="dark" />
    <!-- Bloqueio rigoroso de tradução automática pelo navegador -->
    <meta name="google" content="notranslate" />
    <meta name="googlebot" content="notranslate" />
    <!-- Tela Cheia e PWA para Celular e Tablet -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pads Player" />
    <meta name="format-detection" content="telephone=no" />
    <title>Pads de Áudio em Nuvem</title>
    <meta name="description" content="Reprodutor profissional de pads e loops de áudio com upload e armazenamento em nuvem para celular e tablet." />
    <meta property="og:title" content="Pads de Áudio em Nuvem" />
    <meta property="og:description" content="Reprodutor profissional de pads e loops de áudio com upload e armazenamento em nuvem para celular e tablet." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolygon points='11 5 6 9 2 9 2 15 6 15 11 19 11 5'%3E%3C/polygon%3E%3Cpath d='M19.07 4.93a10 10 0 0 1 0 14.14'%3E%3C/path%3E%3Cpath d='M15.54 8.46a5 5 0 0 1 0 7.07'%3E%3C/path%3E%3C/svg%3E" />
    <style>
      @keyframes appSpin {
        to { transform: rotate(360deg); }
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      html {
        width: 100%;
        min-height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
      }
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at 10% 15%, rgba(37, 99, 235, 0.38) 0%, transparent 45%),
                    radial-gradient(circle at 90% 85%, rgba(59, 130, 246, 0.32) 0%, transparent 50%),
                    radial-gradient(circle at 50% 40%, rgba(96, 165, 250, 0.20) 0%, transparent 60%),
                    linear-gradient(135deg, #060e24 0%, #0a193b 25%, #0f2756 50%, #0a1b42 75%, #04091a 100%);
        background-attachment: fixed;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-y: auto;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      /* Estilização moderna da barra de rolagem azul e branco */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #060f26;
      }
      ::-webkit-scrollbar-thumb {
        background: #2563eb;
        border-radius: 9999px;
        border: 2px solid #060f26;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #60a5fa;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #2563eb #060f26;
      }
      /* Permitir seleção em campos de texto */
      input, textarea, select {
        user-select: text;
        -webkit-user-select: text;
      }
      /* Custom scrollbar hiding for horizontal touch scrollers */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-[#060e24] text-white antialiased selection:bg-blue-500 selection:text-white notranslate" translate="no">
    <div id="root" class="notranslate" translate="no">
      <div style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #0c1c42 0%, #060e24 100%); color: #3b82f6; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: #ffffff; border-radius: 50%; animation: appSpin 0.75s linear infinite;"></div>
        <p style="margin-top: 16px; font-size: 14px; font-weight: 600; color: #ffffff; letter-spacing: 0.03em;">Carregando Pads de Áudio...</p>
      </div>
    </div>
    <noscript>
      <div style="padding: 24px; text-align: center; color: #f87171; background: #0f172a;">
        Este aplicativo requer JavaScript ativado para reproduzir os pads de áudio.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
