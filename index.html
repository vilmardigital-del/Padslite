<!doctype html>
<html lang="pt-BR" class="dark notranslate" translate="no" style="background-color: #090d16; color: #f8fafc;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <meta name="color-scheme" content="dark" />
    <!-- Bloqueio rigoroso de tradução automática pelo navegador -->
    <meta name="google" content="notranslate" />
    <meta name="googlebot" content="notranslate" />
    <!-- Tela Cheia e PWA para Celular e Tablet -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pads Player" />
    <meta name="format-detection" content="telephone=no" />
    <title>Pads de Áudio</title>
    <meta name="description" content="Reprodutor profissional de pads e loops de áudio otimizado para celular e tablet." />
    <meta property="og:title" content="Pads de Áudio" />
    <meta property="og:description" content="Reprodutor profissional de pads e loops de áudio otimizado para celular e tablet." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolygon points='11 5 6 9 2 9 2 15 6 15 11 19 11 5'%3E%3C/polygon%3E%3Cpath d='M19.07 4.93a10 10 0 0 1 0 14.14'%3E%3C/path%3E%3Cpath d='M15.54 8.46a5 5 0 0 1 0 7.07'%3E%3C/path%3E%3C/svg%3E" />
    <style>
      @keyframes appSpin {
        to { transform: rotate(360deg); }
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #090d16;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: manipulation;
        overscroll-behavior-y: none;
        overscroll-behavior-x: none;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Prevenir pull-to-refresh em navegadores móveis */
      body {
        position: fixed;
        overflow-y: auto;
        inset: 0;
      }
      /* Custom scrollbar hiding for horizontal touch scrollers */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased selection:bg-cyan-500 selection:text-black notranslate" translate="no">
    <div id="root" class="notranslate" translate="no">
      <div style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #090d16; color: #94a3b8; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(6,182,212,0.15); border-top-color: #06b6d4; border-radius: 50%; animation: appSpin 0.75s linear infinite;"></div>
        <p style="margin-top: 16px; font-size: 14px; font-weight: 600; color: #e2e8f0; letter-spacing: 0.03em;">Carregando Pads de Áudio...</p>
      </div>
    </div>
    <noscript>
      <div style="padding: 24px; text-align: center; color: #f87171; background: #0f172a;">
        Este aplicativo requer JavaScript ativado para reproduzir os pads de áudio.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
